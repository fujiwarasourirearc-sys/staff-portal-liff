<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>スタッフポータル</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://static.line-scdn.net">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #FAF8F5; color: #333; font-size: 15px; }
  header { background: #E67A16; color: #fff; padding: 10px 16px; position: sticky; top: 0; z-index: 2; }
  header .brand { font-size: 11px; letter-spacing: .15em; opacity: .9; }
  header .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header .title { font-size: 18px; font-weight: bold; }
  header .area { font-size: 13px; }
  header select { font-size: 14px; padding: 4px 6px; border-radius: 6px; border: none; }
  nav { display: flex; background: #fff; border-bottom: 1px solid #e5e0da; position: sticky; top: 58px; z-index: 2; }
  nav a { flex: 1; text-align: center; padding: 11px 0; color: #333; text-decoration: none; font-size: 14px; cursor: pointer; }
  nav a.on { color: #E67A16; border-bottom: 3px solid #E67A16; font-weight: bold; }
  main { padding: 12px; }
  .card { background: #fff; border-radius: 8px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 10px; }
  .muted { color: #888; font-size: 13px; }
  .ng { color: #c0392b; }
  .tabs, .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tabs button, .chips button { border: 1px solid #E67A16; background: #fff; color: #E67A16; border-radius: 16px; padding: 6px 12px; font-size: 13px; }
  .tabs button.on, .chips button.on { background: #E67A16; color: #fff; }
  .filters { display: flex; gap: 8px; margin-bottom: 10px; }
  .filters select { flex: 1; font-size: 14px; padding: 6px; border-radius: 6px; border: 1px solid #ddd; background: #fff; }
  .t { font-weight: bold; font-size: 15px; }
  .s { font-size: 14px; margin-top: 2px; }
  .badges { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .b { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #f0ebe5; color: #555; }
  .b.live { background: #E67A16; color: #fff; }
  .b.rec { background: #2e7d32; color: #fff; }
  .b.imp { background: #c0392b; color: #fff; }
  .b.hope { background: #fff3e0; color: #C9650D; border: 1px solid #E67A16; }
  .morebtn { display: block; width: 100%; margin: 4px 0 10px; padding: 9px; }
  .searchbtn { display: block; width: 100%; text-align: left; border: 1px solid #E67A16; background: #fff; color: #C9650D; border-radius: 8px; padding: 9px 12px; font-size: 14px; margin-bottom: 8px; }
  .searchbtn.on { background: #fff3e0; font-weight: bold; }
  .search .fld { display: block; margin-bottom: 8px; font-size: 13px; color: #666; }
  .search .fld span { display: block; margin-bottom: 3px; }
  .search select, .search input { width: 100%; font-size: 15px; padding: 7px; border: 1px solid #ddd; border-radius: 6px; background: #fff; }
  .search .sub { margin-left: 0; }
  .count { margin: 0 2px 8px; }
  .guide { white-space: pre-wrap; }
  .slot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid #f0ebe5; }
  .slot:first-of-type { border-top: none; }
  .slot .w { font-size: 14px; }
  .apply { background: #E67A16; color: #fff; border: none; border-radius: 6px; padding: 7px 12px; font-size: 13px; white-space: nowrap; }
  .apply:active { background: #C9650D; }
  .day { font-weight: bold; margin: 14px 2px 6px; color: #C9650D; }
  .body { white-space: pre-wrap; margin-top: 8px; font-size: 14px; line-height: 1.6; }
  .link { display: inline-block; margin-top: 8px; color: #E67A16; }
  .note { background: #fff7ee; border: 1px solid #f3d3b0; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 10px; }
  .loading { display: flex; align-items: center; gap: 8px; }
  .spin { width: 16px; height: 16px; border: 2px solid #f3d3b0; border-top-color: #E67A16; border-radius: 50%; display: inline-block; animation: sp 0.8s linear infinite; flex: none; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .sub { margin-left: 8px; border: 1px solid #E67A16; background: #fff; color: #E67A16; border-radius: 6px; padding: 4px 10px; font-size: 13px; }
  .more { margin-top: 8px; border: none; background: none; color: #E67A16; padding: 4px 0; font-size: 14px; }
  dl.evd { margin: 6px 0 0; padding: 10px 12px; background: #fbf7f2; border-radius: 6px; font-size: 14px; }
  dl.evd dt { color: #888; font-size: 12px; margin-top: 8px; }
  dl.evd dt:first-child { margin-top: 0; }
  dl.evd dd { margin: 2px 0 0; white-space: pre-wrap; line-height: 1.5; }
  .cats { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .cats button { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; border: 1px solid #E67A16; background: #fff; color: #C9650D; border-radius: 8px; padding: 9px 12px; font-size: 14px; }
  .cats button.on { background: #E67A16; color: #fff; font-weight: bold; }
  .cats .cn { flex: 1; }
  .evapply { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .evapply .sub { margin-left: 0; padding: 7px 12px; }
  .b.fill { background: #e8f5e9; color: #2e7d32; border: 1px solid #66bb6a; }
  .apblk { padding: 6px 0; border-top: 1px dashed #eee; display: flex; flex-direction: column; gap: 6px; }
  .apblk:first-child { border-top: none; }
  .apblk .st { font-size: 13px; font-weight: bold; color: #C9650D; }
  .fh { font-weight: bold; color: #2e7d32; font-size: 14px; }
  .apblk p, .card > .fh + p { margin: 0; }
  .card.focus { box-shadow: 0 0 0 2px #E67A16; }
  .cats .cc { font-size: 12px; margin-left: 8px; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <div class="brand">SOURIRE ARC</div>
  <div class="row">
    <div class="title">スタッフポータル</div>
    <div class="area" id="area"></div>
  </div>
</header>
<nav id="nav" hidden>
  <a data-p="events">催事情報</a>
  <a data-p="recruit">募集シフト</a>
  <a data-p="notices">お知らせ</a>
</nav>
<main id="view"><div class="card">読み込み中…</div></main>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
