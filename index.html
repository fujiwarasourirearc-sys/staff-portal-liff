<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>スタッフポータル</title>
<style>
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #FAF8F5; color: #333; }
  header { background: #E67A16; color: #fff; padding: 12px 16px; }
  header .brand { font-size: 12px; letter-spacing: .15em; opacity: .9; }
  header .title { font-size: 18px; font-weight: bold; }
  header .area { margin-top: 4px; font-size: 13px; }
  nav { display: flex; background: #fff; border-bottom: 1px solid #e5e0da; }
  nav a { flex: 1; text-align: center; padding: 10px 0; color: #333; text-decoration: none; font-size: 14px; }
  nav a.on { color: #E67A16; border-bottom: 3px solid #E67A16; font-weight: bold; }
  main { padding: 16px; }
  .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .muted { color: #888; font-size: 13px; }
  .ng { color: #c0392b; }
</style>
</head>
<body>
<header>
  <div class="brand">SOURIRE ARC</div>
  <div class="title">スタッフポータル</div>
  <div class="area" id="area"></div>
</header>
<nav id="nav" hidden>
  <a data-p="events">催事情報</a>
  <a data-p="recruit">募集シフト</a>
  <a data-p="notices">お知らせ</a>
</nav>
<main><div class="card" id="view">読み込み中…</div></main>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
